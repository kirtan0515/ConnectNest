<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" width="1600" height="1110" font-family="Arial, Helvetica, sans-serif">
  <style>
    .t { fill:#fff; font:700 15px Arial, Helvetica, sans-serif; text-anchor:middle; }
    .l { font:600 12.5px Arial, Helvetica, sans-serif; fill:#232F3E; text-anchor:middle; paint-order:stroke; stroke:#fff; stroke-width:4px; stroke-linejoin:round; }
    .s { font:11px Arial, Helvetica, sans-serif; fill:#545B64; text-anchor:middle; paint-order:stroke; stroke:#fff; stroke-width:4px; stroke-linejoin:round; }
    .g { font:700 12px Arial, Helvetica, sans-serif; fill:#232F3E; }
    .n { fill:#fff; font:700 12px Arial, Helvetica, sans-serif; text-anchor:middle; }
    .a { stroke:#232F3E; stroke-width:2.2; fill:none; marker-end:url(#ah); }
    .d { stroke:#8a8f98; stroke-width:1.8; fill:none; stroke-dasharray:5 4; marker-end:url(#ahg); }
    .b { stroke:#1A73E8; stroke-width:2.2; fill:none; stroke-dasharray:7 4; marker-end:url(#ahb); }
    .grp { fill:none; stroke:#8a8f98; stroke-width:1.4; stroke-dasharray:6 4; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#232F3E"/></marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a8f98"/></marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1A73E8"/></marker>
  </defs>

  <rect width="1600" height="1110" fill="#ffffff"/>
  <text x="20" y="26" font-size="19" font-weight="700" fill="#232F3E">ConnectNest · AWS architecture</text>
  <text x="20" y="44" font-size="12" fill="#545B64">Fully serverless, defined as code with the AWS CDK (9 stacks), deployed in us-east-1. Solid = live today; dashed grey = planned.</text>

  <g transform="translate(0,28)">
    <!-- AWS cloud boundary -->
    <rect x="190" y="30" width="1390" height="860" rx="6" fill="none" stroke="#232F3E" stroke-width="1.8"/>
    <rect x="190" y="30" width="34" height="26" fill="#232F3E"/>
    <text x="207" y="48" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">AWS</text>
    <text x="234" y="48" class="g">AWS Cloud · us-east-1</text>

    <!-- Group boxes -->
    <rect class="grp" x="215" y="62" width="250" height="320" rx="4"/>
    <text x="225" y="80" class="g">Edge · DNS · TLS</text>
    <rect class="grp" x="215" y="400" width="250" height="230" rx="4"/>
    <text x="225" y="418" class="g">Static hosting</text>
    <rect class="grp" x="500" y="62" width="270" height="568" rx="4"/>
    <text x="510" y="80" class="g">API layer</text>
    <rect class="grp" x="805" y="62" width="270" height="568" rx="4"/>
    <text x="815" y="80" class="g">Compute</text>
    <rect class="grp" x="1110" y="62" width="450" height="568" rx="4"/>
    <text x="1120" y="80" class="g">Data and storage</text>
    <rect class="grp" x="215" y="660" width="1345" height="200" rx="4"/>
    <text x="225" y="678" class="g">Identity · Email · Security · Observability</text>

    <!-- ARROWS (drawn first so labels sit on top) -->
    <path class="a" d="M122,276 L235,276"/>
    <path class="a" d="M307,276 L345,276"/>
    <path class="a" d="M381,312 L381,430"/>
    <path class="a" d="M417,276 L540,276"/>
    <path class="a" d="M612,276 L850,276"/>
    <path class="a" d="M922,276 L1150,276"/>
    <path class="a" d="M1222,466 L1290,466"/>
    <path class="a" d="M1362,466 L1430,466"/>
    <path class="d" d="M90,246 L90,136 L235,136"/>
    <path class="d" d="M381,172 L381,240"/>
    <path class="b" d="M90,306 L90,596 L500,596 L500,466 L540,466"/>
    <path class="b" d="M612,466 L850,466"/>
    <path class="b" d="M850,296 C 790,306 700,366 606,428"/>

    <path class="a" d="M990,136 L886,136 L886,238"/>
    <path class="a" d="M306,700 L306,693 L666,693 L666,698"/>
    <path class="d" d="M450,736 L344,736"/>
    <!-- Users -->
    <circle cx="90" cy="276" r="30" fill="#232F3E"/>
    <circle cx="90" cy="268" r="9" fill="#fff"/>
    <path d="M72,296 C72,282 108,282 108,296 Z" fill="#fff"/>
    <text x="102" y="326" class="l" style="text-anchor:start">Users</text>
    <text x="102" y="340" class="s" style="text-anchor:start">Students</text>
    <text x="102" y="353" class="s" style="text-anchor:start">Faculty · Staff</text>
    <text x="150" y="128" class="s" style="text-anchor:start">DNS</text>

    <!-- EDGE -->
    <g transform="translate(235,100)"><rect width="72" height="72" rx="8" fill="#8C4FFF"/><text x="36" y="43" class="t">R53</text><text x="36" y="92" class="l">Route 53</text><text x="36" y="106" class="s">connectnestapp.com</text></g>
    <g transform="translate(345,100)"><rect width="72" height="72" rx="8" fill="#DD344C"/><text x="36" y="43" class="t">ACM</text><text x="36" y="92" class="l">Certificate Manager</text><text x="36" y="106" class="s">TLS certificate</text></g>
    <g transform="translate(235,240)"><rect width="72" height="72" rx="8" fill="#DD344C"/><text x="36" y="43" class="t">WAF</text><text x="36" y="92" class="l">AWS WAF</text><text x="36" y="106" class="s">Managed rules · rate limit</text></g>
    <g transform="translate(345,240)"><rect width="72" height="72" rx="8" fill="#8C4FFF"/><text x="36" y="43" class="t">CF</text><text x="36" y="92" class="l">CloudFront</text><text x="36" y="106" class="s">CDN · HTTPS</text></g>

    <!-- HOSTING -->
    <g transform="translate(345,430)"><rect width="72" height="72" rx="8" fill="#7AA116"/><text x="36" y="43" class="t">S3</text><text x="36" y="92" class="l">S3 web bucket</text><text x="36" y="106" class="s">Private · Origin Access Control</text></g>
    <text x="235" y="462" class="l" style="text-anchor:start">React SPA</text>
    <text x="235" y="478" class="s" style="text-anchor:start">Built static files</text>
    <text x="235" y="492" class="s" style="text-anchor:start">Via CloudFront only</text>

    <!-- API LAYER -->
    <g transform="translate(540,240)"><rect width="72" height="72" rx="8" fill="#E7157B"/><text x="36" y="43" class="t">API</text><text x="36" y="92" class="l">API Gateway</text><text x="36" y="106" class="s">HTTP API · /api/*</text></g>
    <rect x="510" y="360" width="132" height="22" rx="11" fill="#FDECF4" stroke="#E7157B" stroke-width="1"/>
    <text x="576" y="375" font-size="11" fill="#232F3E" text-anchor="middle" font-weight="600">Cognito JWT authorizer</text>
    <g transform="translate(540,430)"><rect width="72" height="72" rx="8" fill="#E7157B"/><text x="36" y="43" class="t">WS</text><text x="36" y="92" class="l">API Gateway</text><text x="36" y="106" class="s">WebSocket API</text></g>

    <!-- COMPUTE -->
    <g transform="translate(850,240)"><rect width="72" height="72" rx="8" fill="#ED7100"/><text x="36" y="46" class="t" style="font-size:26px">λ</text><text x="36" y="92" class="l">Lambda · Node.js 22</text><text x="36" y="106" class="s">Feature handlers</text><text x="36" y="120" class="s">profiles · events · posts</text><text x="36" y="133" class="s">groups · activity · files</text></g>
    <g transform="translate(850,430)"><rect width="72" height="72" rx="8" fill="#ED7100"/><text x="36" y="46" class="t" style="font-size:26px">λ</text><text x="36" y="92" class="l">Lambda</text><text x="36" y="106" class="s">Realtime handlers</text><text x="36" y="120" class="s">connect · disconnect</text><text x="36" y="133" class="s">WebSocket authorizer</text></g>
    <text x="742" y="338" font-size="11" fill="#1A73E8" font-weight="700" style="paint-order:stroke;stroke:#fff;stroke-width:4px">broadcast</text>

    <!-- DATA -->
    <g transform="translate(1150,240)"><rect width="72" height="72" rx="8" fill="#C925D1"/><text x="36" y="43" class="t">DDB</text><text x="36" y="92" class="l">DynamoDB</text><text x="36" y="106" class="s">One table per entity</text><text x="36" y="120" class="s">incl. WebSocket connections</text></g>
    <g transform="translate(1150,430)"><rect width="72" height="72" rx="8" fill="#7AA116"/><text x="36" y="43" class="t">S3</text><text x="36" y="92" class="l">S3 uploads</text><text x="36" y="106" class="s">Presigned POST · private</text></g>
    <g transform="translate(1290,430)"><rect width="72" height="72" rx="8" fill="#ED7100"/><text x="36" y="46" class="t" style="font-size:26px">λ</text><text x="36" y="92" class="l">Lambda</text><text x="36" y="106" class="s">Image moderation</text></g>
    <g transform="translate(1430,430)"><rect width="72" height="72" rx="8" fill="#01A88D"/><text x="36" y="43" class="t">REK</text><text x="36" y="92" class="l">Rekognition</text><text x="36" y="106" class="s">Unsafe images removed</text></g>

    <g transform="translate(990,100)"><rect width="72" height="72" rx="8" fill="#E7157B"/><text x="36" y="43" class="t">EB</text><text x="36" y="92" class="l">EventBridge</text><text x="36" y="106" class="s">Daily schedule · purge</text></g>
    <rect x="222" y="358" width="140" height="20" rx="10" fill="#F3EDFF" stroke="#8C4FFF" stroke-width="1"/>
    <text x="292" y="372" font-size="10.5" fill="#232F3E" text-anchor="middle" font-weight="600">CF Function · /api rewrite</text>
    <text x="520" y="689" class="s">custom-message trigger</text>
    <text x="397" y="730" class="s">OAuth</text>
    <text x="700" y="560" class="s" style="display:none"></text>
    <!-- BOTTOM ROW -->
    <g transform="translate(270,700)"><rect width="72" height="72" rx="8" fill="#DD344C"/><text x="36" y="43" class="t">COG</text><text x="36" y="92" class="l">Cognito</text><text x="36" y="106" class="s">Google · Microsoft</text><text x="36" y="120" class="s">Authenticator-app MFA</text></g>
    <g transform="translate(450,700)"><rect width="72" height="72" rx="8" fill="#DD344C"/><text x="36" y="43" class="t">SM</text><text x="36" y="92" class="l">Secrets Manager</text><text x="36" y="106" class="s">OAuth secrets</text></g>
    <g transform="translate(630,700)"><rect width="72" height="72" rx="8" fill="#DD344C"/><text x="36" y="43" class="t">SES</text><text x="36" y="92" class="l">Simple Email Service</text><text x="36" y="106" class="s">Branded verification email</text></g>
    <g transform="translate(810,700)"><rect width="72" height="72" rx="8" fill="#E7157B"/><text x="36" y="43" class="t">CT</text><text x="36" y="92" class="l">CloudTrail</text><text x="36" y="106" class="s">Audit trail</text></g>
    <g transform="translate(990,700)"><rect width="72" height="72" rx="8" fill="#DD344C"/><text x="36" y="43" class="t">GD</text><text x="36" y="92" class="l">GuardDuty</text><text x="36" y="106" class="s">Threat detection</text></g>
    <g transform="translate(1170,700)"><rect width="72" height="72" rx="8" fill="#DD344C"/><text x="36" y="43" class="t">IAM</text><text x="36" y="92" class="l">IAM</text><text x="36" y="106" class="s">Least privilege per Lambda</text></g>
    <g transform="translate(1350,700)"><rect width="72" height="72" rx="8" fill="#E7157B"/><text x="36" y="43" class="t">CW</text><text x="36" y="92" class="l">CloudWatch</text><text x="36" y="106" class="s">Logs · metrics · alarms</text><text x="36" y="120" class="s">SNS email alerts</text></g>

    <!-- Step numbers -->
    <g><circle cx="178" cy="276" r="11" fill="#232F3E"/><text x="178" y="280" class="n">1</text></g>
    <g><circle cx="381" cy="378" r="11" fill="#232F3E"/><text x="381" y="382" class="n">2</text></g>
    <g><circle cx="478" cy="276" r="11" fill="#232F3E"/><text x="478" y="280" class="n">3</text></g>
    <g><circle cx="731" cy="276" r="11" fill="#232F3E"/><text x="731" y="280" class="n">4</text></g>
    <g><circle cx="1036" cy="276" r="11" fill="#232F3E"/><text x="1036" y="280" class="n">5</text></g>
    <g><circle cx="1256" cy="466" r="11" fill="#232F3E"/><text x="1256" y="470" class="n">6</text></g>
    <g><circle cx="300" cy="596" r="11" fill="#1A73E8"/><text x="300" y="600" class="n">7</text></g>
  </g>

  <rect class="grp" x="190" y="940" width="1390" height="110" rx="6"/>
  <text x="205" y="962" class="g">Planned / future (not deployed)</text>
  <rect x="205" y="975" width="184" height="58" rx="8" fill="#fff" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="297" y="999" class="l" style="stroke:none">Recommendations</text>
  <text x="297" y="1017" class="s" style="stroke:none">Week 11 · suggested events</text>
  <rect x="401" y="975" width="184" height="58" rx="8" fill="#fff" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="493" y="999" class="l" style="stroke:none">Notifications</text>
  <text x="493" y="1017" class="s" style="stroke:none">RSVP and event reminders</text>
  <rect x="597" y="975" width="184" height="58" rx="8" fill="#fff" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="689" y="999" class="l" style="stroke:none">Dashboards and logs</text>
  <text x="689" y="1017" class="s" style="stroke:none">CloudWatch views · access logs</text>
  <rect x="793" y="975" width="184" height="58" rx="8" fill="#fff" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="885" y="999" class="l" style="stroke:none">Org Microsoft sign-in</text>
  <text x="885" y="1017" class="s" style="stroke:none">Needs university tenant approval</text>
  <rect x="989" y="975" width="184" height="58" rx="8" fill="#fff" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1081" y="999" class="l" style="stroke:none">Encryption and network</text>
  <text x="1081" y="1017" class="s" style="stroke:none">KMS keys · VPC endpoints</text>
  <rect x="1185" y="975" width="184" height="58" rx="8" fill="#fff" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1277" y="999" class="l" style="stroke:none">CI/CD pipeline</text>
  <text x="1277" y="1017" class="s" style="stroke:none">Build, test, deploy on push</text>
  <rect x="1381" y="975" width="184" height="58" rx="8" fill="#fff" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1473" y="999" class="l" style="stroke:none">Automated tests</text>
  <text x="1473" y="1017" class="s" style="stroke:none">API and UI suites</text>
  <!-- Legend -->
  <g transform="translate(215,1085)" font-size="12" fill="#545B64">
    <line x1="0" y1="-4" x2="40" y2="-4" stroke="#232F3E" stroke-width="2.2"/>
    <text x="48" y="0">Request path</text>
    <line x1="150" y1="-4" x2="190" y2="-4" stroke="#1A73E8" stroke-width="2.2" stroke-dasharray="7 4"/>
