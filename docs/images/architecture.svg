    <line x1="340" y1="-4" x2="380" y2="-4" stroke="#8a8f98" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="388" y="0">DNS and certificate</text>
    <text x="560" y="0">Tiles use AWS service-category colors with short labels (not the official icon set).</text>
  </g>
</svg>
