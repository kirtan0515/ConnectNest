<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d2a2c" />
    <!-- Content-Security-Policy: defense-in-depth against XSS. Blocks inline/remote
         script injection; allows only self + the AWS/Google endpoints we call. Fonts are self-hosted. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https://*.amazonaws.com; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://*.amazonaws.com wss://*.amazonaws.com https://*.amazoncognito.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://*.amazoncognito.com"
    />
    <meta
      name="description"
      content="ConnectNest is an independent student project: campus events, groups, posts and messaging in one place."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>ConnectNest — Your campus, connected</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
