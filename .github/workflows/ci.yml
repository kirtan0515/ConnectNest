name: CI

# Type-check, unit-test, and build every push and pull request. This workflow
# never touches AWS — it only verifies the code. Deployment is a separate,
# manually triggered workflow (deploy.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (type-check + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (unit tests + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # CI=false so build warnings don't fail the build (Vite + our setup).
      - run: CI=false npm run build

  infra:
    name: Infra (CDK type-check + synth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      # CDK bundles the Lambda handlers with esbuild, spawning it from the repo
      # root. esbuild must resolve there (root deps) and the handlers' runtime
      # imports must resolve too (backend deps).
      - name: Install root deps (esbuild for bundling)
        run: npm ci
      - name: Install backend deps (handler imports)
        working-directory: backend
        run: npm ci
      - name: Install infra deps
        working-directory: infra
        run: npm ci
      - name: Type-check
        working-directory: infra
        run: npm run typecheck
      # Synthesize the CloudFormation templates without deploying. No AWS
      # credentials needed; the SPA build is optional at synth time.
      - name: CDK synth
        working-directory: infra
        run: npx cdk synth --quiet
