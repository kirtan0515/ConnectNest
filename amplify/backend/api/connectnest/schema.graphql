type Event @model
  @auth(rules: [
    { allow: owner },
    { allow: private, operations: [read] }
  ]) {
  id: ID!
  title: String!
  description: String
  date: AWSDate
  location: String
  organizer: String!
  attendees: [String]
}

type ChatMessage @model
  @auth(rules: [
    { allow: owner }
  ]) {
  id: ID!
  sender: String!
  content: String!
  timestamp: AWSDateTime
  chatroomID: ID!
}

type Group @model
  @auth(rules: [
    { allow: owner }
  ]) {
  id: ID!
  name: String!
  description: String
  members: [String]
  posts: [Post] @hasMany
}

type Post @model
  @auth(rules: [
    { allow: owner },
    { allow: private, operations: [read] }
  ]) {
  id: ID!
  content: String!
  image: String
  createdAt: AWSDateTime
  createdBy: String!
  likes: Int @default(value: "0")
  comments: [Comment] @hasMany
}

type Comment @model
  @auth(rules: [
    { allow: owner }
  ]) {
  id: ID!
  postId: ID!
  content: String!
  createdBy: String!
  createdAt: AWSDateTime
}
